name: check

# `scripts/check.sh` on every push to main and every pull request: in Docker, `npm ci`
# from the committed package-lock.json, single-copy pins, compile, key regeneration
# against the committed hashes, format, lint, types, build, tests and the
# separate-project build; then the repository check (labels over the full history, the
# repository layout).
# No wallet, network account or live transaction is used.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret-free checks
        run: scripts/check.sh
